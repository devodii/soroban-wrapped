official_owners: [stellar, OpenZeppelin, kalepail, Creit-Tech, CoinFabrik, theahaco, Soneso, lightsail-network, StellarCN, script3, blend-capital, soroswap, reflector-network, stellar-expert, paltalabs, SDF]

needs:
  # testing and QA
  - id: contract-testing-harness
    title: Test harness and fixtures for Soroban contracts
    category: testing
    summary: Every project rebuilds environment setup, mock auths, address generation, client wiring and time travel for its tests.
    query: '"test harness" or "test setup" or "mock_all_auths" or "test environment" or testutils or "integration test" or "test helper" or "test fixtures" or "time travel"'
    signals: {paths: ['(^|/)tests?/(common|helpers?|utils?|setup|fixtures?)', 'test_utils', 'testutils']}
    tools: [{id: soroban-sdk, relation: partial}]
    deliverables:
      - "Reusable test harness crate with typed clients and builders"
      - "Ledger time and auth control helpers"
      - "Snapshot and golden test support"
      - "Templates for integration tests across several contracts"
    success:
      - "Lines of test setup removed per project"
      - "Adoption in new projects"
  - id: fuzzing-property-testing
    title: Fuzzing and property testing tooling
    category: testing
    summary: Contract authors want fuzzing and invariant checks but have to wire them up by hand.
    query: 'fuzz or fuzzing or fuzzer or proptest or "property test" or "property-based" or invariant or "cargo-fuzz" or "afl"'
    signals: {dependencies: [proptest, arbitrary, libfuzzer-sys, honggfuzz, cargo-fuzz]}
    tools: [{id: cargo-fuzz-soroban, relation: partial}]
    deliverables:
      - "Fuzz target generator from the contract spec"
      - "Invariant library for token and vault contracts"
      - "CI integration with corpus caching"
    success:
      - "Contracts with fuzz targets"
      - "Bugs found per audit cycle"
  - id: local-dev-network
    title: Reliable local network and fixtures
    category: testing
    summary: Local and standalone networks are hard to keep running, reset and seed with accounts, contracts and tokens.
    query: '"local network" or standalone or quickstart or friendbot or "docker compose" or "local node" or "reset network" or "seed accounts"'
    signals: {paths: ['docker-compose', 'quickstart', 'friendbot']}
    tools: [{id: stellar-quickstart, relation: partial}]
    deliverables:
      - "One command local stack with seeded accounts and deployed system contracts"
      - "Snapshot and restore of ledger state"
      - "Time and protocol version controls"
    success:
      - "Time to first deployed contract"
      - "Projects using the local stack in CI"
  - id: fork-testing-mainnet-state
    title: Fork and simulate against mainnet state
    category: testing
    summary: Developers want to test against real mainnet contracts and balances without deploying anything.
    query: '"mainnet fork" or "fork mainnet" or "state fork" or "fork testing" or "mainnet state" or "against mainnet" or "ledger snapshot" or "soroban-fork"'
    signals: {dependencies: [soroban-fork]}
    tools: []
    deliverables:
      - "Lazy loading fork of ledger entries into the test environment"
      - "Pinned snapshot support for reproducible tests"
      - "Helpers to impersonate accounts"
    success:
      - "Tests run against real protocols"
      - "Time to reproduce a mainnet issue"
  - id: gas-resource-profiling
    title: Resource, budget and fee profiling
    category: testing
    summary: Developers hit CPU, memory, footprint and fee limits and have little tooling to see where resources go.
    query: 'budget or "cpu instructions" or "resource limit" or "resource usage" or profiling or "fee estimation" or footprint or "exceeded limit" or "cost model" or "resource fee"'
    signals: {}
    tools: [{id: stellar-lab, relation: partial}]
    deliverables:
      - "Per function resource and fee profiler with diffs between commits"
      - "CI gate on regressions"
      - "Visual breakdown of host function costs"
    success:
      - "Projects tracking resource usage in CI"
      - "Reduction in failed transactions"
  # dev workflow
  - id: contract-deploy-automation
    title: Deployment and environment automation
    category: dev-workflow
    summary: Teams write bespoke scripts to build, deploy, initialise and wire many contracts across testnet and mainnet.
    query: '"deploy script" or "deployment script" or "deploy contracts" or "deployment automation" or "multi-contract" or "environment config" or "deploy to mainnet" or "deployed.json" or "contract addresses"'
    signals: {paths: ['(^|/)(scripts?|deploy)[^/]*\.(sh|ts|js|py|mjs)$', 'deploy(ed)?(ment)?[-_.]', 'Makefile', 'justfile']}
    tools: [{id: stellar-cli, relation: partial}]
    deliverables:
      - "Declarative deployment manifest with dependency ordering"
      - "Per network address book and verification"
      - "Idempotent re-deploy and upgrade"
      - "Secrets and identity handling"
    success:
      - "Bespoke deploy scripts replaced"
      - "Failed or half-finished deployments"
  - id: contract-upgrade-migration
    title: Safe upgrades and storage migration
    category: dev-workflow
    summary: Upgrading a deployed contract and migrating its storage is done by hand and is a common source of bugs.
    query: 'upgrade or upgradeable or migration or "storage migration" or "update_current_contract_wasm" or "state migration" or "contract versioning" or "upgrade path"'
    signals: {}
    tools: [{id: openzeppelin-stellar, relation: partial}]
    deliverables:
      - "Storage layout diff and compatibility checker"
      - "Migration runner with dry run"
      - "Upgrade authorisation and timelock templates"
    success:
      - "Upgrades without data loss"
      - "Audit findings related to upgrades"
  - id: reproducible-builds-verification
    title: Reproducible builds and source verification
    category: dev-workflow
    summary: Users cannot easily verify that a deployed wasm matches public source, and builds are not reproducible.
    query: '"reproducible build" or "verify source" or "source verification" or "wasm hash" or "build attestation" or "verified contract" or "source_repo" or "sep-55" or "attest"'
    signals: {}
    tools: [{id: stellar-expert, relation: partial}]
    deliverables:
      - "Hermetic build container and CI action producing signed attestations"
      - "Public verification service and badge"
      - "Explorer integration"
    success:
      - "Verified contracts on mainnet"
      - "Time to verify"
  - id: ci-cd-templates
    title: CI/CD templates and actions for Soroban
    category: dev-workflow
    summary: Every repo writes its own GitHub workflow for build, test, lint, size checks and deploy.
    query: '"github action" or "github actions" or "ci pipeline" or "continuous integration" or "ci workflow" or "cargo test" or "clippy" or "wasm size check"'
    signals: {paths: ['\.github/workflows/']}
    tools: [{id: stellar-cli, relation: partial}]
    deliverables:
      - "Maintained GitHub Actions for build, test, size and resource gates"
      - "Reusable workflows for deploy to testnet"
      - "Caching and matrix templates"
    success:
      - "Repos using shared workflows"
      - "CI minutes saved"
  - id: wasm-size-optimization
    title: Wasm size analysis and optimisation
    category: dev-workflow
    summary: Contracts bump into size limits and teams hand-tune release profiles and optimisers.
    query: '"wasm size" or "contract size" or "too large" or "wasm-opt" or "size limit" or "optimize wasm" or "opt-level" or "binary size" or "twiggy"'
    signals: {paths: ['wasm-opt', 'optimi[sz]e']}
    tools: [{id: stellar-cli, relation: partial}]
    deliverables:
      - "Size report per function and dependency"
      - "Recommended profile presets"
      - "CI budget for size"
    success:
      - "Contracts under the size limit without rewrites"
  - id: contract-bindings-clients
    title: Typed contract clients for more languages
    category: dev-workflow
    summary: Generated bindings are mostly TypeScript, other stacks write contract clients by hand.
    query: 'bindings or "generated client" or "contract client" or "typed client" or "type bindings" or "codegen" or "contract spec" or "openapi" or "client generation"'
    signals: {paths: ['bindings', 'generated', 'contract-client']}
    tools: [{id: stellar-cli, relation: partial}, {id: js-stellar-sdk, relation: partial}]
    deliverables:
      - "Binding generators for Python, Go, Swift, Kotlin and Rust from the contract spec"
      - "Watch mode that regenerates on contract change"
      - "Docs from the spec"
    success:
      - "Hand written clients replaced"
      - "Languages supported"
  - id: project-scaffolding-templates
    title: Project scaffolding and starter templates
    category: dev-workflow
    summary: New projects start from copies of examples and re-solve project layout, frontend wiring and tooling.
    query: 'scaffold or template or boilerplate or starter or "create app" or "project template" or "getting started" or "starter kit" or "cargo generate"'
    signals: {}
    tools: [{id: scaffold-stellar, relation: partial}]
    deliverables:
      - "Opinionated templates for common app types"
      - "Upgrade path for existing projects"
      - "Template marketplace and tests"
    success:
      - "Time to first working dapp"
  - id: error-debugging-tooling
    title: Readable errors and contract debugging
    category: dev-workflow
    summary: Contract errors surface as numeric codes and opaque host errors, and debugging relies on printing.
    query: '"error code" or "contract error" or debugging or debugger or "stack trace" or "diagnostic events" or "wasmvm" or "InvalidAction" or "UnreachableCodeReached" or "decode error" or "error message"'
    signals: {}
    tools: [{id: stellar-lab, relation: partial}]
    deliverables:
      - "Error decoder mapping codes to names and docs from the contract spec"
      - "Step through debugger or trace viewer for simulations"
      - "Panic location mapping to source"
    success:
      - "Time to diagnose a failed transaction"
  - id: ttl-state-archival-management
    title: State archival and TTL management
    category: dev-workflow
    summary: Entries expire and archive, so teams build keep-alive bots and restore flows and still lose state.
    query: 'ttl or archival or archived or "restore footprint" or "extend ttl" or "state expiry" or "rent" or "keepalive" or "bump" or "expired entries" or "restore entry"'
    signals: {dependencies: [], paths: ['(bump|extend|restore|keep[-_]?alive)[^/]*\.(sh|ts|js|py|rs)$']}
    tools: [{id: stellar-cli, relation: partial}]
    deliverables:
      - "TTL monitor with alerts and auto extension bot"
      - "Restore and re-upload helpers"
      - "Rent cost forecasting"
    success:
      - "Archived production entries"
      - "Keep-alive scripts replaced"
  # infrastructure and data
  - id: event-indexing-subscriptions
    title: Event indexing and subscriptions
    category: data
    summary: Apps poll RPC and write bespoke indexers to follow contract events and state, with only days of retention.
    query: 'indexer or indexing or "event listener" or "event subscription" or getEvents or "poll events" or webhook or "contract events" or subgraph or "event stream" or "real-time"'
    signals: {paths: ['(^|/)(indexer|ingest|listener|worker|poller)[^/]*/', 'indexer', 'ingest'], dependencies: [pg, postgres, sqlx, diesel, prisma, typeorm]}
    tools: [{id: mercury, relation: partial}, {id: goldsky, relation: partial}, {id: galexie, relation: partial}]
    deliverables:
      - "Self-hostable indexer that decodes events from the contract spec into typed tables"
      - "Webhooks and websocket subscriptions"
      - "Reorg safe backfill from the ledger archive"
    success:
      - "Bespoke indexers replaced"
      - "Time to index a new contract"
  - id: contract-analytics-dashboards
    title: Contract analytics and dashboards
    category: data
    summary: Teams hand-build dashboards for usage, TVL and users from raw chain data.
    query: 'analytics or dashboard or metrics or "tvl" or "usage stats" or dune or "data studio" or grafana or "on-chain data" or "query data"'
    signals: {dependencies: [grafana, recharts, chart.js, d3, plotly]}
    tools: [{id: hubble, relation: partial}, {id: stellar-expert, relation: partial}]
    deliverables:
      - "Dashboard builder over decoded contract data"
      - "Public dataset of decoded events and calls"
      - "Embeddable widgets"
    success:
      - "Teams using shared dashboards"
  - id: historical-data-access
    title: Historical data access
    category: data
    summary: RPC keeps days of data, so apps need history archives, data lakes or paid indexers for older data.
    query: '"history archive" or "historical data" or "ledger history" or "full history" or "data lake" or "archive node" or "retention" or "older events" or "bulk export" or "backfill"'
    signals: {}
    tools: [{id: galexie, relation: partial}, {id: hubble, relation: partial}, {id: horizon, relation: partial}]
    deliverables:
      - "Query API over full history with contract level filters"
      - "Incremental exports to common formats"
      - "Hosted free tier for builders"
    success:
      - "Projects relying on history"
      - "Cost to query a year"
  - id: rpc-infrastructure-reliability
    title: RPC reliability, caching and failover
    category: infrastructure
    summary: Public RPC rate limits, outages and retention force teams to add retry, failover and caching layers.
    query: '"rate limit" or "rate limiting" or "rpc provider" or failover or "load balancer" or "rpc timeout" or "retry" or "429" or "self-host rpc" or "rpc node" or "caching layer"'
    signals: {}
    tools: [{id: stellar-rpc, relation: partial}]
    deliverables:
      - "Smart RPC client with failover, batching and caching"
      - "Hosted gateway with free quotas and metrics"
      - "Self host recipes"
    success:
      - "Request failures in dapps"
      - "Projects on the shared client"
  - id: transaction-submission-relayer
    title: Transaction submission, fee sponsorship and sequencing
    category: infrastructure
    summary: Apps build queues for sequence numbers, retries, fee bumps and sponsorship.
    query: '"fee bump" or "fee sponsorship" or "sponsored" or relayer or "sequence number" or "tx queue" or "transaction queue" or "resubmit" or "channel account" or "tx_bad_seq" or "submission"'
    signals: {paths: ['relayer', 'submitter', 'tx[-_]?queue']}
    tools: [{id: launchtube, relation: partial}, {id: openzeppelin-monitor, relation: partial}]
    deliverables:
      - "Open relayer with channel accounts, retries and fee policies"
      - "SDK middleware for simulate, assemble, sign, submit and confirm"
      - "Quota and abuse controls"
    success:
      - "Failed submissions"
      - "Bespoke submit queues replaced"
  - id: monitoring-alerting
    title: Contract monitoring and alerting
    category: infrastructure
    summary: Teams need alerts on contract events, balances, TTLs and failures and build them ad hoc.
    query: 'monitoring or monitor or alerting or alerts or observability or "uptime" or "pagerduty" or "slack alert" or "health check" or "watch contract" or "notification"'
    signals: {dependencies: [prom-client, "@sentry/node", sentry-sdk, prometheus]}
    tools: [{id: openzeppelin-monitor, relation: partial}]
    deliverables:
      - "Rule based monitor for events, balances"
      - "TTL and failed calls"
      - "Notification channels"
      - "Prebuilt rules for common protocols"
    success:
      - "Incidents detected by monitors"
  # wallets and accounts
  - id: wallet-integration-ux
    title: Wallet connection and signing UX
    category: wallets
    summary: Every dapp integrates several wallets and signing flows by hand, with inconsistent behaviour.
    query: '"connect wallet" or "wallet connect" or "wallet integration" or "sign transaction" or "multi-wallet" or "wallet adapter" or freighter or albedo or xbull or lobstr or "wallet kit" or "sep-43"'
    signals: {dependencies: ["@stellar/freighter-api", "@creit.tech/stellar-wallets-kit", "@albedo-link/intent", "@lobstrco/signer-extension-api", "@walletconnect/sign-client"]}
    tools: [{id: freighter, relation: partial}, {id: wallets-kit, relation: partial}]
    deliverables:
      - "Unified wallet interface with consistent errors and network switching"
      - "Mobile and WalletConnect support"
      - "UX components for review and signing"
    success:
      - "Dapps on the unified interface"
  - id: smart-accounts-passkeys
    title: Smart accounts, passkeys and session keys
    category: wallets
    summary: Passkey and smart account flows are rebuilt per project and need relayers and recovery.
    query: 'passkey or webauthn or "smart account" or "smart wallet" or "account abstraction" or "session key" or "social recovery" or "custom account" or "__check_auth"'
    signals: {dependencies: [passkey-kit, "@simplewebauthn/browser", "@simplewebauthn/server", passkey-kit-sdk]}
    tools: [{id: passkey-kit, relation: partial}]
    deliverables:
      - "Audited smart account contracts with policies and recovery"
      - "SDK and relayer for onboarding without XLM"
      - "Reference apps"
    success:
      - "Apps shipping smart accounts"
  - id: mobile-sdk-gaps
    title: Mobile SDK coverage for Soroban
    category: wallets
    summary: Mobile developers lack maintained Soroban support in Swift, Kotlin and React Native.
    query: 'mobile or "react native" or flutter or swift or kotlin or android or ios or "mobile sdk" or "expo"'
    signals: {dependencies: [react-native, expo, stellar_flutter_sdk, stellar-ios-mac-sdk]}
    tools: [{id: stellar-php-sdk, relation: partial}, {id: java-stellar-sdk, relation: partial}]
    deliverables:
      - "Maintained mobile SDKs with contract invocation, simulation and signing"
      - "Sample apps"
      - "Secure key storage guidance"
    success:
      - "Mobile apps using Soroban"
  - id: sdk-language-gaps
    title: Soroban support across language SDKs
    category: sdk
    summary: Backends in Python, Go, Java and others have gaps in contract invocation, simulation and event parsing.
    query: '"python sdk" or "go sdk" or "java sdk" or "soroban support" or "invoke contract" or "contract invocation" or "scval" or "xdr" or "ScVal conversion" or "native to scval"'
    signals: {dependencies: [stellar-sdk, stellar_sdk, "github.com/stellar/go"]}
    tools: [{id: python-stellar-sdk, relation: partial}, {id: go-stellar, relation: partial}]
    deliverables:
      - "Feature parity matrix and tests across SDKs"
      - "ScVal conversion helpers"
      - "Shared test vectors"
    success:
      - "Parity across languages"
  - id: frontend-components-hooks
    title: Frontend components and hooks for contracts
    category: frontend
    summary: React and other frontends rebuild contract state hooks, forms and transaction status UIs.
    query: 'react or hooks or "ui components" or "component library" or "contract form" or "transaction status" or "design system" or "wallet button" or nextjs or "state management"'
    signals: {dependencies: [react, next, wagmi, "@tanstack/react-query"]}
    tools: [{id: stellar-design-system, relation: partial}]
    deliverables:
      - "Hooks for reads, simulations, writes and events with caching"
      - "Components generated from the contract spec"
      - "Transaction status and error UI"
    success:
      - "Frontend code removed per dapp"
  # security
  - id: security-static-analysis
    title: Static analysis and linting for Soroban
    category: security
    summary: Teams lack easy automated checks for auth, arithmetic, storage and upgrade mistakes before audit.
    query: '"static analysis" or "security audit" or vulnerability or vulnerabilities or linter or lint or "audit report" or "security scanner" or "detectors" or "common bugs" or "audit checklist"'
    signals: {paths: ['audit', 'SECURITY\.md']}
    tools: [{id: scout-audit, relation: partial}]
    deliverables:
      - "Detector set mapped to the most common real bugs"
      - "Editor and CI integration with fix suggestions"
      - "Public rule metrics"
    success:
      - "Findings caught before audit"
  - id: formal-verification
    title: Formal verification and specifications
    category: security
    summary: Formal verification is rare because specs and provers are hard to adopt.
    query: '"formal verification" or "formally verified" or prover or "certora" or "specification" or "invariants" or "model checking" or "kani" or "symbolic"'
    signals: {}
    tools: [{id: certora-sunbeam, relation: partial}]
    deliverables:
      - "Spec templates for token, vault and AMM contracts"
      - "Prover integration in CI"
      - "Education material"
    success:
      - "Verified contracts"
  - id: access-control-governance-multisig
    title: Access control, multisig and governance
    category: security
    summary: Admin keys, timelocks, multisig and DAOs are rebuilt per project.
    query: 'multisig or "multi-sig" or governance or dao or timelock or "admin key" or "access control" or "role based" or "voting" or "proposal" or "owner only" or "two-step"'
    signals: {}
    tools: [{id: openzeppelin-stellar, relation: partial}]
    deliverables:
      - "Audited governor, timelock and multisig contracts and UI"
      - "Admin key rotation tooling"
      - "Policy templates"
    success:
      - "Projects using shared governance"
  - id: key-management-signing
    title: Key management, custody and hardware signing
    category: security
    summary: Teams handle deploy keys and signers with ad hoc secrets and weak rotation.
    query: '"hardware wallet" or ledger or trezor or "key management" or hsm or kms or custody or "secret key" or "key rotation" or "signer" or "secrets"'
    signals: {paths: ['\.env', 'secrets?']}
    tools: []
    deliverables:
      - "Signer abstraction for CLI and CI with KMS and hardware backends"
      - "Rotation and recovery playbooks"
    success:
      - "Leaked key incidents"
  # ecosystem and interop
  - id: oracles-price-feeds
    title: Oracle and price feed integration
    category: interop
    summary: Apps wire oracles, staleness checks and fallback prices by hand.
    query: 'oracle or "price feed" or "price oracle" or twap or "price data" or reflector or "stale price" or "price source"'
    signals: {dependencies: [reflector]}
    tools: [{id: reflector, relation: partial}]
    deliverables:
      - "Oracle client library with staleness, deviation and fallback policies"
      - "Mock oracle for tests"
      - "Feed registry"
    success:
      - "Integrations using the shared client"
  - id: cross-chain-bridging
    title: Cross-chain bridging and EVM interop tooling
    category: interop
    summary: Bridging and cross chain messaging need integration kits and testing support.
    query: 'bridge or bridging or "cross-chain" or "cross chain" or evm or ethereum or wormhole or axelar or allbridge or cctp or "cross-chain messaging"'
    signals: {dependencies: [ethers, viem, web3, "@wormhole-foundation/sdk"]}
    tools: [{id: allbridge, relation: partial}]
    deliverables:
      - "Unified bridge SDK and quote API"
      - "Local multi chain test environment"
      - "Message verification libraries"
    success:
      - "Bridge integrations shipped"
  - id: anchors-onramps-sep
    title: Anchors, on and off ramps, SEP flows
    category: anchors
    summary: Teams implement SEP-10, 12, 24 and 31 flows and KYC by hand.
    query: 'anchor or "on-ramp" or "off-ramp" or onramp or offramp or "sep-24" or "sep-6" or "sep-10" or "sep-12" or "sep-31" or kyc or "stellar.toml" or "deposit withdraw"'
    signals: {dependencies: ["@stellar/typescript-wallet-sdk", anchor-platform]}
    tools: [{id: anchor-platform, relation: partial}, {id: typescript-wallet-sdk, relation: partial}]
    deliverables:
      - "Turnkey anchor kit with KYC provider plugins"
      - "SEP conformance test suite"
      - "Payout and reconciliation tooling"
    success:
      - "Anchors launched"
      - "Conformance pass rate"
  - id: compliance-regulated-assets
    title: Compliance and regulated asset tooling
    category: interop
    summary: Regulated assets, clawback, allow lists and sanctions screening are custom per issuer.
    query: '"regulated asset" or "sep-8" or clawback or "authorization flags" or "allow list" or whitelist or compliance or sanctions or "travel rule" or "trustline authorization"'
    signals: {}
    tools: []
    deliverables:
      - "Approval server and compliance contract templates"
      - "Reporting and screening integrations"
      - "Issuer dashboard"
    success:
      - "Regulated assets issued with shared tooling"
  - id: token-standards-tooling
    title: Token creation, factories and distribution
    category: tokens
    summary: Token deployment, vesting, airdrops and launch flows are rewritten per project.
    query: 'token or "sep-41" or airdrop or vesting or "token factory" or launchpad or "token sale" or "token distribution" or "mint" or "token wrapper" or "asset contract"'
    signals: {}
    tools: [{id: openzeppelin-stellar, relation: partial}]
    deliverables:
      - "No code token factory with audited templates"
      - "Vesting and airdrop tools with proofs"
      - "Token metadata and listing helpers"
    success:
      - "Tokens launched through the tooling"
  - id: defi-primitives-sdk
    title: DeFi integration SDKs and routing
    category: defi
    summary: Apps integrate AMMs and lending by hand and lack shared routing and quote tools.
    query: 'swap or amm or "liquidity pool" or lending or "price impact" or slippage or aggregator or routing or "yield" or "liquidation" or "flash loan" or "dex"'
    signals: {dependencies: ["@soroswap/sdk", "@blend-capital/blend-sdk"]}
    tools: [{id: soroswap, relation: partial}, {id: blend, relation: partial}]
    deliverables:
      - "Unified quote and routing SDK across protocols"
      - "Simulation of positions and liquidations"
      - "Shared contract interfaces and mocks"
    success:
      - "Apps using the shared SDK"
  - id: zk-privacy-tooling
    title: Zero knowledge and privacy tooling
    category: zk
    summary: Verifier deployment, proof generation and circuits integration are bespoke.
    query: '"zero knowledge" or zk or snark or groth16 or plonk or "zk proof" or "zero-knowledge" or circom or noir or risc0 or "proof verification" or bn254 or "merkle proof" or "privacy"'
    signals: {dependencies: [snarkjs, circomlib, "@noir-lang/noir_js", risc0-zkvm, ark-groth16, ark-bn254]}
    tools: [{id: risc0-verifier, relation: partial}]
    deliverables:
      - "Verifier generators for common proof systems"
      - "Proof tooling and SDK for browser and mobile"
      - "Reference private apps"
    success:
      - "ZK apps on Stellar"
  - id: payments-escrow-primitives
    title: Payments, escrow and recurring payment primitives
    category: payments
    summary: Escrow, subscriptions, payroll and invoicing flows are rebuilt for each product.
