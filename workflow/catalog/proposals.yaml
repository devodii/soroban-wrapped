proposals:
  - id: storage-ttl
    name: "#[derive(Storage)] with automatic lifetimes"
    kind: derive
    summary: Typed get and set helpers per storage key, with the lifetime extended for you.
    sketch: |
      #[derive(Storage)]
      pub enum DataKey {
          #[instance(ttl(1000, 10_000))] Admin,
          #[persistent(ttl(5000, 50_000), default(0))] Balance(Address),
      }
    thresholds: {min_repos: 25, min_share: 0.10, min_occurrences: 100}
    covered_by: []
    patterns:
      - {id: ttl.extend_call, role: boilerplate}
      - {id: ttl.hardcoded_threshold, role: boilerplate}
      - {id: ttl.bump_helper, role: boilerplate}
      - {id: storage.datakey_enum, role: boilerplate}
      - {id: storage.getter_wrapper, role: boilerplate}
      - {id: storage.setter_wrapper, role: boilerplate}
      - {id: ttl.persistent_write_without_extend, role: footgun}
      - {id: ttl.instance_write_without_extend, role: footgun}
      - {id: ttl.persistent_read_without_extend, role: footgun}
    bug_classes: [ttl-archival]

  - id: auth-guards
    name: "#[auth] and #[only_auth] guards"
    kind: attribute
    summary: Authorisation declared on the parameter or function instead of typed by hand.
    sketch: |
      pub fn transfer(env: Env, #[auth] from: Address, to: Address, amount: i128)
      #[only_auth(Self::admin(&env))] pub fn set_fee(env: Env, fee: u32)
    thresholds: {min_repos: 25, min_share: 0.20, min_occurrences: 200}
    covered_by: [openzeppelin]
    patterns:
      - {id: auth.require_auth, role: boilerplate}
      - {id: auth.admin_guard, role: boilerplate}
      - {id: auth.owner_guard, role: boilerplate}
      - {id: auth.mutating_without_auth, role: footgun}
      - {id: auth.address_param_without_auth, role: footgun}
      - {id: access.only_macro, role: adopted}
    bug_classes: [missing-auth]

  - id: init-guard
    name: "#[init] guard"
    kind: attribute
    summary: One shot initialisation that cannot run twice.
    sketch: |
      #[init] pub fn initialize(env: Env, admin: Address) { DataKey::set_admin(&env, &admin); }
    thresholds: {min_repos: 20, min_share: 0.10, min_occurrences: 20}
    covered_by: []
    patterns:
      - {id: init.initialize_fn, role: boilerplate}
      - {id: init.reinit_guard, role: boilerplate}
      - {id: init.unguarded, role: footgun}
      - {id: init.constructor, role: adopted}
    bug_classes: [reinitialisation]

  - id: ensure-errors
    name: "ensure! and or_err"
    kind: macro
    summary: Guards and missing keys turned into typed errors in one line.
    sketch: |
      ensure!(amount > 0, Error::InvalidAmount);
      let pool = Key::try_get_pool(&env).or_err(&env, Error::NotInitialized)?;
    thresholds: {min_repos: 30, min_share: 0.15, min_occurrences: 300}
    covered_by: []
    patterns:
      - {id: error.if_return_err, role: boilerplate}
      - {id: error.unwrap_or_else_panic, role: boilerplate}
      - {id: error.panic_with_error, role: boilerplate}
      - {id: error.contracterror_enum, role: boilerplate}
      - {id: error.plain_panic, role: footgun}
      - {id: error.unwrap_call, role: footgun}
      - {id: error.expect_call, role: footgun}
      - {id: storage.unwrap_get, role: footgun}
    bug_classes: [untyped-failure]

  - id: event-structs
    name: "#[event] structs"
    kind: attribute
    summary: Typed events with topics checked at compile time.
    sketch: |
      #[event] pub struct Transfer { #[topic] pub from: Address, #[topic] pub to: Address, pub amount: i128 }
      Transfer { from, to, amount }.publish(&env);
    thresholds: {min_repos: 20, min_share: 0.10, min_occurrences: 100}
    covered_by: [soroban-token-sdk]
    patterns:
      - {id: event.publish_tuple, role: boilerplate}
      - {id: event.symbol_short, role: boilerplate}
      - {id: event.struct_publish_helper, role: boilerplate}
      - {id: event.contractevent, role: adopted}
    bug_classes: [event-indexing]

  - id: soroban-test
    name: "#[soroban_test] harness"
    kind: attribute
    summary: The environment, mock auths, contract registration and client built for the test.
    sketch: |
      #[soroban_test(VaultContract)]
      fn test_deposit(env: Env, client: VaultContractClient, #[addr] alice: Address)
    thresholds: {min_repos: 40, min_share: 0.25, min_occurrences: 400}
    covered_by: []
    patterns:
      - {id: test.env_default, role: boilerplate}
      - {id: test.register, role: boilerplate}
      - {id: test.client_new, role: boilerplate}
      - {id: test.address_generate, role: boilerplate}
      - {id: test.setup_helper, role: boilerplate}
      - {id: auth.mock_all_auths, role: footgun}
    bug_classes: [test-gap]

  - id: checked-math
    name: Checked token arithmetic
    kind: macro
    summary: Amount maths that can never wrap, whatever the build flags.
    sketch: |
      let total = checked!(balance + amount)?;
    thresholds: {min_repos: 20, min_share: 0.10, min_occurrences: 100}
    covered_by: []
    patterns:
      - {id: error.checked_arithmetic, role: boilerplate}
      - {id: error.unchecked_arithmetic, role: footgun}
    bug_classes: [arithmetic]

  - id: pausable-upgradeable
    name: Pause and upgrade switches
    kind: derive
    summary: Pause and upgrade written once, behind access control.
    sketch: |
      #[derive(Pausable, Upgradeable)] pub struct Contract;
    thresholds: {min_repos: 15, min_share: 0.05, min_occurrences: 30}
    covered_by: [openzeppelin]
    patterns:
      - {id: pause.paused_flag, role: boilerplate}
      - {id: upgrade.update_wasm, role: boilerplate}
      - {id: upgrade.derive_macro, role: adopted}
      - {id: access.only_macro, role: adopted}
    bug_classes: [upgrade-safety, missing-auth]

  - id: throws-metadata
    name: "#[throws] error metadata"
    kind: attribute
    summary: The errors a function can return, written into contract metadata so clients can read them.
    sketch: |
      #[throws(Error::InsufficientBalance, Error::InvalidAmount)] pub fn withdraw(...)
    thresholds: {min_repos: 30, min_share: 0.15, min_occurrences: 200}
    covered_by: []
    patterns:
      - {id: error.contracterror_enum, role: boilerplate}
      - {id: error.panic_with_error, role: boilerplate}
      - {id: meta.contractmeta, role: adopted}
      - {id: error.unwrap_call, role: footgun}
    bug_classes: [untyped-failure]
