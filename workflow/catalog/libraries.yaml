libraries:
  - id: openzeppelin
    name: OpenZeppelin Stellar Contracts
    crates: [stellar-access, stellar-tokens, stellar-macros, stellar-contract-utils, stellar-fee-abstraction, stellar-governance, stellar-accounts, stellar-event-assertion]
    owners: [OpenZeppelin]
    solves: [access, pause, upgrade, token]
  - id: soroban-kit
    name: soroban-kit
    crates: [soroban-kit]
    solves: [storage, access]
  - id: loam
    name: Loam SDK
    crates: [loam-sdk, loam-soroban-sdk, loam-sdk-macro, loam-build]
    solves: [storage, modules]
  - id: soroban-sdk-tools
    name: Soroban SDK tools
    crates: [soroban-sdk-tools, soroban-sdk-tools-macro]
    solves: [storage, errors]
  - id: soroban-token-sdk
    name: soroban-token-sdk
    crates: [soroban-token-sdk]
    solves: [token, events]
  - id: soroban-sdk
    name: soroban-sdk
    crates: [soroban-sdk]
    solves: []
  - id: stellar-sdk
    name: Stellar clients
    crates: [stellar-xdr, stellar-strkey, soroban-client, stellar-rpc-client, stellar-baselib]
    solves: []
