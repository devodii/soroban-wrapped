patterns:
  - id: ttl.extend_call
    category: ttl
    description: A storage entry has its lifetime extended by hand.
    match: {kind: regex, regex: '\.(persistent|instance|temporary)\(\)\s*\.extend_ttl\(|\.instance\(\)\s*\.extend_ttl\('}
    diff: 'extend_ttl'

  - id: ttl.instance_bump
    category: ttl
    description: The contract instance lifetime is extended by hand.
    match: {kind: regex, regex: '\.instance\(\)\s*\.extend_ttl\('}
    diff: 'instance\(\)\s*\.extend_ttl'

  - id: ttl.persistent_bump
    category: ttl
    description: A persistent entry lifetime is extended by hand.
    match: {kind: regex, regex: '\.persistent\(\)\s*\.extend_ttl\('}
    diff: 'persistent\(\)\s*\.extend_ttl'

  - id: ttl.hardcoded_threshold
    category: ttl
    description: Lifetime thresholds kept as constants every contract declares itself.
    match: {kind: regex, regex: '(?m)^\s*(pub\s+)?const\s+\w*(LIFETIME|TTL|BUMP|THRESHOLD|LEDGER)\w*\s*:\s*u32\s*='}
    diff: 'const\s+\w*(LIFETIME|TTL|BUMP|THRESHOLD)'

  - id: ttl.bump_helper
    category: ttl
    description: A wrapper function that exists only to extend lifetimes.
    match: {kind: function, name: '(?i)^(extend|bump|renew|refresh)\w*(ttl|lifetime|instance|storage)\w*$|^(ttl|bump)\w*$'}

  - id: ttl.persistent_write_without_extend
    category: ttl
    description: A function writes a persistent entry and never extends its lifetime.
    match: {kind: function, contains: ['\.persistent\(\)\s*\.set\('], lacks: ['extend_ttl', '(?i)\b(bump|extend)\w*\('], skip_tests: true}
    diff: 'persistent\(\)\s*\.set'

  - id: ttl.instance_write_without_extend
    category: ttl
    description: A function writes instance storage and never extends the instance lifetime.
    match: {kind: function, contains: ['\.instance\(\)\s*\.set\('], lacks: ['extend_ttl', '(?i)\b(bump|extend)\w*\('], skip_tests: true}

  - id: ttl.persistent_read_without_extend
    category: ttl
    description: A function reads a persistent entry and never extends its lifetime.
    match: {kind: function, contains: ['\.persistent\(\)\s*\.get\('], lacks: ['extend_ttl', '(?i)\b(bump|extend)\w*\('], skip_tests: true}

  - id: auth.require_auth
    category: auth
    description: An address is authorised by hand.
    match: {kind: regex, regex: '\.require_auth\(\)'}
    diff: 'require_auth'

  - id: auth.require_auth_for_args
    category: auth
    description: An address is authorised for specific arguments by hand.
    match: {kind: regex, regex: '\.require_auth_for_args\('}
    diff: 'require_auth_for_args'

  - id: auth.admin_guard
    category: auth
    description: A function loads a stored admin and requires its auth.
    match: {kind: function, contains: ['(?i)admin', '\.require_auth\(\)'], contract_only: true, skip_tests: true}
    diff: '(?i)admin.*require_auth|require_auth.*admin'

  - id: auth.owner_guard
    category: auth
    description: A function loads a stored owner and requires its auth.
    match: {kind: function, contains: ['(?i)\bowner\b', '\.require_auth\(\)'], contract_only: true, skip_tests: true}

  - id: auth.mutating_without_auth
    category: auth
    description: A public contract function writes storage and never requires any auth.
    match: {kind: function, contract_only: true, skip_tests: true, contains: ['\.(persistent|instance|temporary)\(\)\s*\.(set|remove)\('], lacks: ['require_auth', 'only_', '#\[(only|when|auth)', 'ensure_']}
    diff: 'require_auth'

  - id: auth.address_param_without_auth
    category: auth
    description: A public contract function takes an Address parameter and never authorises it.
    match: {kind: function, contract_only: true, skip_tests: true, params_match: ':\s*Address', lacks: ['require_auth']}

  - id: auth.mock_all_auths
    category: auth
    description: Tests switch every auth check off instead of asserting the real ones.
    match: {kind: regex, regex: 'mock_all_auths(_allowing_non_root_auth)?\(\)'}

  - id: storage.datakey_enum
    category: storage
    description: A storage key enum every contract declares itself.
    match: {kind: type, type_kind: enum, flags: [contracttype], name: '(?i)(data|storage|store)?_?key(s)?$'}

  - id: storage.getter_wrapper
    category: storage
    description: A tiny function whose only job is reading one storage key.
    match: {kind: function, max_loc: 12, contains: ['\.storage\(\)', '\.get(::<[^>]+>)?\('], lacks: ['require_auth', '\.set\('], skip_tests: true}

  - id: storage.setter_wrapper
    category: storage
    description: A tiny function whose only job is writing one storage key.
    match: {kind: function, max_loc: 12, contains: ['\.storage\(\)', '\.set\('], lacks: ['require_auth'], skip_tests: true}

  - id: storage.unwrap_get
    category: storage
    description: A storage read is unwrapped, so a missing key aborts without a typed error.
    match: {kind: regex, regex: '\.get(::<[^>]+>)?\([^;]*\)\s*\.unwrap\(\)'}
    diff: '\.get\([^;]*\)\s*\.unwrap\(\)'

  - id: storage.unwrap_or_default
    category: storage
    description: A storage read falls back to a default by hand.
    match: {kind: regex, regex: '\.get(::<[^>]+>)?\([^;]*\)\s*\.unwrap_or(_default)?\('}

  - id: storage.has_check
    category: storage
    description: A key presence check written by hand.
    match: {kind: regex, regex: '\.(persistent|instance|temporary)\(\)\s*\.has\('}

  - id: storage.contracttype_struct
    category: storage
    description: A struct stored under a key, deriving through contracttype.
    match: {kind: type, type_kind: struct, flags: [contracttype]}

  - id: init.initialize_fn
    category: init
    description: A hand written initialize function.
    match: {kind: function, name: '^(initialize|init|setup|__init)$', contract_only: true}

  - id: init.constructor
    category: init
    description: The sdk constructor is used.
    match: {kind: function, name: '^__constructor$'}

  - id: init.reinit_guard
    category: init
    description: An initialize function that checks it has not run before.
    match: {kind: function, name: '^(initialize|init|setup)$', contract_only: true, contains: ['\.has\(|is_initialized|AlreadyInitialized|already\s+initiali[sz]ed|get::<[^>]*>\([^)]*\)\.is_some']}
    diff: 'AlreadyInitialized|already initialized'

  - id: init.unguarded
    category: init
    description: An initialize function with no check against running twice.
    match: {kind: function, name: '^(initialize|init|setup)$', contract_only: true, lacks: ['\.has\(', 'is_initialized', '(?i)already', '\.is_some\(\)', '\.is_none\(\)']}

  - id: error.contracterror_enum
    category: error
    description: A contract error enum.
    match: {kind: type, type_kind: enum, flags: [contracterror]}

  - id: error.panic_with_error
    category: error
    description: A typed error raised through panic_with_error.
    match: {kind: regex, regex: 'panic_with_error!\s*\('}
    diff: 'panic_with_error!'

  - id: error.unwrap_or_else_panic
    category: error
    description: An option turned into a typed error through unwrap_or_else and panic_with_error.
    match: {kind: regex, regex: 'unwrap_or_else\(\s*\|\|?\s*panic_with_error!'}

  - id: error.if_return_err
    category: error
    description: A guard written as an if block returning an error.
    match: {kind: regex, regex: '(?s)if\s+[^{};]+\{\s*return\s+Err\('}
    diff: 'return\s+Err\('

  - id: error.plain_panic
    category: error
    description: An untyped panic with a string message.
    match: {kind: regex, regex: '\bpanic!\s*\('}
    diff: '\bpanic!\s*\('

  - id: error.unwrap_call
    category: error
    description: An unwrap in contract code.
    match: {kind: function, contract_only: true, skip_tests: true, contains: ['\.unwrap\(\)']}

  - id: error.expect_call
    category: error
    description: An expect in contract code.
    match: {kind: function, contract_only: true, skip_tests: true, contains: ['\.expect\(']}

  - id: error.unchecked_arithmetic
    category: error
    description: Token amounts changed with plain operators, so overflow depends on build flags.
    match: {kind: function, contract_only: true, skip_tests: true, contains: ['\b(amount|balance|supply|total|fee|price)\w*\s*[+\-*]=?\s*\w']}
    diff: '\b(amount|balance|supply|total|fee)\w*\s*[+\-*]=?\s*\w'

  - id: error.checked_arithmetic
    category: error
    description: Arithmetic guarded by hand with checked operations.
    match: {kind: regex, regex: '\.(checked_(add|sub|mul|div)|saturating_(add|sub|mul))\('}

  - id: event.publish_tuple
    category: event
    description: An event published as a tuple of topics.
    match: {kind: regex, regex: '\.events\(\)\s*\.publish\('}
    diff: 'events\(\)\s*\.publish'

  - id: event.symbol_short
    category: event
    description: A topic written as a short symbol literal.
    match: {kind: regex, regex: 'symbol_short!\s*\('}

  - id: event.contractevent
    category: event
    description: The sdk event macro is used.
    match: {kind: regex, regex: '#\[contractevent'}

  - id: event.struct_publish_helper
    category: event
    description: A function whose body only publishes an event.
    match: {kind: function, max_loc: 10, contains: ['\.events\(\)\s*\.publish\('], lacks: ['require_auth', '\.set\('], skip_tests: true}

  - id: test.env_default
    category: test
    description: A test builds its environment by hand.
    match: {kind: regex, regex: 'Env::default\(\)'}

  - id: test.register
    category: test
    description: A test registers the contract by hand.
    match: {kind: regex, regex: '\.register(_contract)?\('}

  - id: test.client_new
    category: test
    description: A test builds the generated client by hand.
    match: {kind: regex, regex: '\w+Client::new\(\s*&\w+'}

  - id: test.address_generate
    category: test
    description: A test generates an address by hand.
    match: {kind: regex, regex: 'Address::generate\('}

  - id: test.setup_helper
    category: test
    description: A test helper that builds the environment, client and addresses.
    match: {kind: function, is_test_helper: true, contains: ['Env::default\(\)', '(register|Client::new)']}

  - id: test.ledger_time_travel
    category: test
    description: A test moves the ledger sequence or time by hand.
    match: {kind: regex, regex: '\.ledger\(\)\s*\.(set|with_mut)\('}

  - id: meta.contractmeta
    category: meta
    description: Contract metadata declared with contractmeta.
    match: {kind: regex, regex: 'contractmeta!\s*\('}

  - id: meta.contractimport
    category: interop
    description: Another contract imported from its wasm.
    match: {kind: regex, regex: 'contractimport!\s*\('}

  - id: interop.invoke_contract
    category: interop
    description: A contract called through the raw invoke interface.
    match: {kind: regex, regex: '\.invoke_contract(::<[^>]+>)?\('}

  - id: interop.token_client
    category: interop
    description: A token contract called through the sdk token client.
    match: {kind: regex, regex: 'token::(Token)?Client::new\(|TokenClient::new\('}

  - id: access.only_macro
    category: access
    description: A library access macro is already used.
    match: {kind: regex, regex: '#\[(only_(owner|admin|role)|when_(not_)?paused|has_role|has_any_role)\b'}

  - id: upgrade.update_wasm
    category: upgrade
    description: A contract upgrades itself by hand.
    match: {kind: regex, regex: 'update_current_contract_wasm\('}

  - id: upgrade.derive_macro
    category: upgrade
    description: A library upgrade derive is already used.
    match: {kind: regex, regex: 'derive\([^)]*Upgradeable'}

  - id: pause.paused_flag
    category: access
    description: A pause switch written by hand.
    match: {kind: function, contract_only: true, skip_tests: true, contains: ['(?i)\bpaused\b|\bis_paused\b']}

  - id: perf.clone_in_loop
    category: perf
    description: Clones inside loops in contract code.
    match: {kind: regex, regex: '(?s)for\s+[^{]+\{[^}]*\.clone\(\)'}
