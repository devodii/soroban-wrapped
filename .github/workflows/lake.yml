name: lake

on:
  workflow_dispatch:
    inputs:
      network:
        description: mainnet or testnet
        default: mainnet
      start:
        description: first day, YYYY-MM-DD
        default: "2026-01-01"
      end:
        description: last day, YYYY-MM-DD
        default: "2026-01-07"
      chunk_days:
        description: days per parallel job
        default: "7"
      limit_ledgers:
        description: read only this many ledgers per day, for a speed probe (0 means all)
        default: "0"
      threads:
        description: duckdb threads per job
        default: "64"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
    steps:
      - id: chunks
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import date, timedelta
          start = date.fromisoformat("${{ inputs.start }}")
          end = date.fromisoformat("${{ inputs.end }}")
          step = int("${{ inputs.chunk_days }}")
          chunks = []
          day = start
          while day <= end:
              last = min(day + timedelta(days=step - 1), end)
              chunks.append({"from": day.isoformat(), "to": last.isoformat()})
              day = last + timedelta(days=1)
          print("chunks=" + json.dumps(chunks))
          PY

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Summarise the ledger archive
        run: |
          limit=""
          if [ "${{ inputs.limit_ledgers }}" != "0" ]; then limit="--limit-ledgers ${{ inputs.limit_ledgers }}"; fi
          start=$(date +%s)
          uv run soroban-wrapped lake --network "${{ inputs.network }}" \
            --from "${{ matrix.chunk.from }}" --to "${{ matrix.chunk.to }}" \
            --out out/lake --threads "${{ inputs.threads }}" $limit 2>&1 | tee run.log
          echo "elapsed_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
          grep "done:" run.log >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: lake-${{ inputs.network }}-${{ matrix.chunk.from }}
          path: out/lake/*.parquet
          retention-days: 3
