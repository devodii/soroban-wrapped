name: soroban-wrapped

x-indexer: &indexer
  build: .
  working_dir: /app
  volumes:
    - ./:/app
    - indexer-venv:/app/.venv
    - clones:/clones
  environment:
    UV_LINK_MODE: copy
    DATABASE_URL: postgresql://soroban:soroban@db:5432/soroban
    GITHUB_TOKENS: ${GITHUB_TOKENS:-}
    MAINNET_RPC_URL: ${MAINNET_RPC_URL:-https://mainnet.sorobanrpc.com}
    WORKFLOW_FILE: ${WORKFLOW_FILE:-/app/workflow/workflow.yaml}
    CLONE_DIR: /clones
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soroban
      POSTGRES_PASSWORD: soroban
      POSTGRES_DB: soroban
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  indexer:
    <<: *indexer
    profiles: [tools]
    entrypoint: ["uv", "run", "soroban-wrapped"]

volumes:
  indexer-venv:
  clones:
